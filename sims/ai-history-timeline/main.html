<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>AI History Timeline</title>
    <link href="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/dist/vis-timeline-graph2d.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background: white; }
        main { width: 100%; }
        #title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            padding: 10px 0 4px 0;
            background: aliceblue;
            border-bottom: 1px solid silver;
        }
        #timeline {
            width: 100%;
            height: 340px;
            background: aliceblue;
            border-bottom: 1px solid silver;
        }
        #detail-panel {
            background: white;
            border-top: 1px solid #ddd;
            padding: 10px 16px;
            min-height: 120px;
            font-size: 14px;
        }
        #detail-panel h3 { margin: 0 0 4px 0; font-size: 16px; }
        #detail-panel p { margin: 0; color: #444; }
        #hint { color: #888; font-size: 13px; text-align: center; padding: 6px; }

        /* Timeline item color overrides */
        .vis-item.foundational { background: #4A90D9; border-color: #2c6fad; color: white; }
        .vis-item.winter { background: #E74C3C; border-color: #a93226; color: white; }
        .vis-item.expert { background: #27AE60; border-color: #1a7a44; color: white; }
        .vis-item.modern { background: #F39C12; border-color: #b07d0e; color: white; }
        .vis-item.selected { box-shadow: 0 0 0 3px #333; }
    </style>
</head>
<body>
<main>
    <div id="title">AI History Timeline (1950–2025)</div>
    <div id="timeline"></div>
    <div id="hint">Click any event to see details below</div>
    <div id="detail-panel">
        <p style="color:#999;">Select an event on the timeline to see its description and significance.</p>
    </div>
</main>
<script src="ai-history-timeline.js"></script>
</body>
</html>
