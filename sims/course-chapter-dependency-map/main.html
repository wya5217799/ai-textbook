<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Course Chapter Dependency Map</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background: white; }
        main { width: 100%; display: flex; flex-direction: column; }
        #title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 8px 0;
            background: aliceblue;
            border-bottom: 1px solid silver;
        }
        #network-container {
            width: 100%;
            height: 420px;
            background: aliceblue;
            border-bottom: 1px solid silver;
        }
        #legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 6px 14px;
            background: aliceblue;
            border-bottom: 1px solid silver;
            font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
        #detail {
            padding: 8px 14px;
            min-height: 60px;
            font-size: 13px;
            background: white;
            color: #444;
        }
        #detail strong { color: #222; }
    </style>
</head>
<body>
<main>
    <div id="title">Course Chapter Dependency Map</div>
    <div id="network-container"></div>
    <div id="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#27AE60"></span>Foundation</div>
        <div class="legend-item"><span class="legend-dot" style="background:#E67E22"></span>Data</div>
        <div class="legend-item"><span class="legend-dot" style="background:#4A90D9"></span>Math/Core ML</div>
        <div class="legend-item"><span class="legend-dot" style="background:#8E44AD"></span>Neural Networks</div>
        <div class="legend-item"><span class="legend-dot" style="background:#16A085"></span>Classification</div>
        <div class="legend-item"><span class="legend-dot" style="background:#E74C3C"></span>Advanced</div>
    </div>
    <div id="detail">Click any chapter node to highlight its prerequisites and dependents.</div>
</main>
<script src="course-chapter-dependency-map.js"></script>
</body>
</html>
