site_name: Artificial Intelligence System - Intelligent Textbook
site_description: An intelligent textbook for H63AIS Artificial Intelligence System course
site_url: https://wya5217799.github.io/ai-textbook/

# ── Theme ──────────────────────────────────────────────────────────────────────
theme:
  name: material
  features:
    # Feature 7: Code copy button
    - content.code.copy
    - content.code.select
    - content.code.annotate
    # Feature 18: Search enhancements
    - search.suggest
    - search.highlight
    - search.share
    # Feature 19: Table of contents
    - navigation.indexes
    - toc.follow
    - navigation.top
    - navigation.footer

# ── Plugins ────────────────────────────────────────────────────────────────────
plugins:
  # Feature 18: Search with suggestions
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

# ── Markdown Extensions ────────────────────────────────────────────────────────
markdown_extensions:
  # Feature 5: KaTeX math equations (currency-safe: use \(...\) for inline, $$...$$ for display)
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['round']
      block_syntax: ['dollar', 'square']

  # Feature 6: Code syntax highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Feature 13: Auto-append abbreviations glossary
      auto_append:
        - includes/abbreviations.md

  # Feature 8: Mermaid diagrams
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # Feature 13: Abbreviations & glossary tooltips
  - abbr

  # Admonitions (used by features 11, 27)
  - admonition
  - pymdownx.details

  # Feature 19: Table of contents with permalinks
  - toc:
      permalink: true
      toc_depth: 3

  # Additional useful extensions
  - attr_list
  - md_in_html
  - tables
  - footnotes

# ── Extra JavaScript ────────────────────────────────────────────────────────────
extra_javascript:
  # Feature 5: KaTeX math rendering
  - js/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  # Feature 12: Interactive quizzes
  - javascripts/quiz.js
  # Feature 28: Prompt admonition copy button
  - javascripts/extra.js

# ── Extra CSS ───────────────────────────────────────────────────────────────────
extra_css:
  # Feature 5: KaTeX styles
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  # Feature 12: Quiz styles
  - css/quiz.css
  # Features 27: Extra CSS (iframe, prompt admonition)
  - css/extra.css

